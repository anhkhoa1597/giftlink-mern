name: 'CI/CD for GiftLink'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint_backend:
    name: 🔍 Lint Backend JS (JSHint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run JSHint on backend
        run: |
          jshint giftlink-backend/src/**/*.js
          jshint giftlink-backend/app.js
          jshint giftlink-backend/server.js
          echo "✅ Backend linting done"

  lint_frontend:
    name: 💅 Lint Frontend JS (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd giftlink-frontend
          yarn install

      - name: Run ESLint
        run: |
          cd giftlink-frontend
          yarn lint || true # Không fail job nếu chỉ có warning
          echo "✅ Frontend linting done"

  build_frontend:
    name: 🛠️ Build Frontend App
    runs-on: ubuntu-latest
    needs: [lint_frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & build
        run: |
          cd giftlink-frontend
          yarn install
          yarn build
          echo "✅ Frontend build done"
