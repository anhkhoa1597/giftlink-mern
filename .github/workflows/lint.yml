name: Lint and Build Frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: giftlink-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run ESLint
        run: yarn lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: giftlink-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run Build
        run: yarn build
