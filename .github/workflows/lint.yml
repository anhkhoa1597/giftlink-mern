name: 🧹 Lint Frontend Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Install dependencies
        run: |
          cd giftlink-frontend
          yarn install

      - name: Run ESLint
        run: |
          cd giftlink-frontend
          yarn lint
